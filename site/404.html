<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Redirect all 404s to index.html for SPA routing
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      sessionStorage.redirect = path + search + hash;
      window.location.replace(path.split('/').slice(0, -1).join('/') + '/index.html');
    </script>
  </head>
  <body></body>
</html>
